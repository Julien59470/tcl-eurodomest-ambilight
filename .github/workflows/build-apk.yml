name: Build Android TV debug APK
on:
  push:
    branches: [main]
    paths-ignore:
      - "Eurodomest-Ambilight-TCL-RGBIC-v0.3.0.apk"
  workflow_dispatch:
concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform 35
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify pure-Java protocol tests
        run: |
          mkdir -p tests/bin
          javac -d tests/bin app/src/main/java/fr/ambilight/eurodomest/{RawRgb,TuyaWire,RgbicFourZone}.java tests/BridgePureTests.java
          java -cp tests/bin BridgePureTests
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Eurodomest-Ambilight-TCL-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish verified APK on main (direct Downloader URL)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Eurodomest-Ambilight-TCL-RGBIC-v0.3.0.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Eurodomest-Ambilight-TCL-RGBIC-v0.3.0.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publier APK Android TV v0.3.0 [skip ci]"
            git push origin HEAD:main
          fi
